<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adventsatelier · Winter 2026</title><style>
*{box-sizing:border-box}body{margin:0;background:#101b24;color:#fff4e2;font:16px/1.55 system-ui,sans-serif}main{max-width:840px;margin:auto;padding:18px}header,nav,.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}header{border-bottom:1px solid #ffffff38;padding-bottom:12px}small,label{font-size:.8rem;letter-spacing:.07em}select,button{font:inherit;color:inherit;background:#22343d;border:1px solid #ffffff45;border-radius:9px;padding:10px 14px;cursor:pointer}button:disabled{opacity:.48;cursor:default}button:focus-visible,select:focus-visible{outline:3px solid gold}button:hover:enabled{border-color:#ffdc8d}h1,h2{font:normal clamp(2rem,6vw,3.6rem)/1.04 Georgia;margin:12px 0}h2{font-size:1.8rem}p{max-width:65ch}canvas{display:block;width:100%;border-radius:14px;margin:16px 0;background:#18273a}.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}.grid button{padding:8px 1px;min-height:44px;font-family:Georgia;font-size:1.22rem}.active{background:#ffdf9c;color:#25202a}article{padding:17px 0}#actions{display:flex;gap:8px;flex-wrap:wrap}#scene{position:relative}#scene button{position:absolute;transform:translate(-50%,-50%);background:transparent;border:0;font-size:clamp(19px,4vw,32px);padding:0;min-width:44px;min-height:44px}.hint{outline:3px dashed gold}footer{margin:24px 0;color:#c7c8bd}input{width:20px;height:20px;vertical-align:middle}@media(max-width:550px){.grid{grid-template-columns:repeat(6,1fr)}main{padding:12px}select{max-width:100%}}
</style><main><header><b>✦ Adventsatelier</b><small>WINTER 2026</small><select id="world" aria-label="Kalender wählen"></select></header><article><small id="tag"></small><h1 id="title"></h1><p id="intro"></p><div id="scene"><canvas id="art" width="800" height="360" aria-label="Illustrierte Winterwelt"></canvas></div><div id="panel"></div><div id="actions"></div><p id="msg" role="status"></p></article><div class="row"><h2>Dezember</h2><label><input type="checkbox" id="test"> Testmodus</label></div><div class="grid" id="days"></div><footer><button id="music">♫ Musik einschalten</button> <span id="saved"></span></footer></main><script>
const worlds=[null,null,null,null,
['Partnerin','Das Atelier der kleinen Wunder','EIN WINTERALBUM','In einem verschneiten Atelier wartet ein Album mit leeren Seiten. Jeder gefundene Gegenstand bringt ein Stück der gemeinsamen Weihnachtswelt zurück.','Das Fenster zum Dezember','Im Atelier ist gerade jemand aufgesprungen. Zwischen Garnrollen, Büchern und Pinseln liegen drei Dinge für die erste Albumseite.','','','','','','']
];
const fixed=4;
const $=id=>document.getElementById(id),world=$('world'),dayGrid=$('days'),ctx=$('art').getContext('2d');let w=fixed??0,step=0,choice=0,playing=false,deadline=0,clock=0,found=[],hints=0,sequence=[],progress={},audio=null,musicTimer;
const now=new Date(),dateKey=now.getFullYear()*10000+(now.getMonth()+1)*100+now.getDate();$('test').checked=dateKey<20261201;
function save(){try{localStorage.setItem('advent26-v1-'+w,JSON.stringify(progress));$('saved').textContent='Lokal gespeichert'}catch{$('saved').textContent='Speicherung hier nicht verfügbar'}}
function act(label,fn){let b=document.createElement('button');b.textContent=label;b.onclick=fn;$('actions').append(b);return b}
function scene(){let c=ctx,t=Date.now()/2000,phase=dateKey>=20261220?3:dateKey>=20261213?2:dateKey>=20261206?1:0;let palettes=[['#142d49','#d68870'],['#292446','#d9a26c'],['#312450','#a998dc'],['#141820','#776331'],['#473441','#bf8966']];let [a,b]=palettes[w],g=c.createLinearGradient(0,0,0,360);g.addColorStop(0,a);g.addColorStop(1,b);c.fillStyle=g;c.fillRect(0,0,800,360);function rect(x,y,ww,h,color){c.fillStyle=color;c.fillRect(x,y,ww,h)}function poly(points,color){c.beginPath();points.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.closePath();c.fillStyle=color;c.fill()}function circle(x,y,r,color){c.beginPath();c.arc(x,y,r,0,7);c.fillStyle=color;c.fill()}
circle(632-phase*64,65,32,'#fff0ce');for(let i=0;i<45;i++)circle(i*173%800,i*47%165,1.3,'#ffead1');
if(w===0||w===3){for(let i=0;i<6;i++){rect(0,155+i*17,800,14,i%2?'#38414d':'#283443');for(let j=0;j<72;j++)rect(j*12+(i%2)*5,158+i*17,4,3,w===3?'#e5bd47':'#c89a83')}poly([[0,256],[800,256],[800,360],[0,360]],w===3?'#55583c':'#386360');c.strokeStyle='#dae1cd';c.lineWidth=3;c.strokeRect(306,244,186,65);c.strokeRect(280,309,240,42);for(let x of [65,735]){rect(x,57,5,100,'#1e3044');rect(x-26,53,55,10,'#fff3bf');poly([[x-26,63],[x+28,63],[x+100,215],[x-100,215]],'#fff4ba18')}}
else if(w===4){rect(52,38,190,171,'#ddba89');rect(60,46,174,155,'#435974');for(let i=0;i<15;i++)circle(65+i*43%160,53+i*33%140,2,'#fff');rect(143,40,7,170,'#e3c99b');rect(54,128,184,7,'#e3c99b');for(let k=0;k<2;k++){for(let i=0;i<24;i++){let h=25+i*17%41;rect(300+18*i,105+89*k-h,13,h,['#80716e','#a96752','#6c8581','#ceab70'][i%4])}rect(290,105+89*k,465,9,'#573e38')}rect(0,243,800,117,'#846352');for(let i=0;i<17;i++){let x=i*59%780,y=257+i*29%89;rect(x,y,22,8,['#bc866d','#c4ad87','#6a8983'][i%3]);circle(x+10,y-5,5,'#68494a')}}
else {poly([[0,200],[120,97],[223,192],[398,91],[570,180],[694,110],[800,173],[800,360],[0,360]],'#514f69');for(let i=0;i<30;i++){let x=i*83%800,y=156+i*21%86;poly([[x,y-45],[x-20,y+22],[x+20,y+22]],'#374c52')}poly([[0,241],[240,224],[470,245],[800,212],[800,360],[0,360]],'#ddd7e0');for(let i=0;i<5;i++){let x=22+i*162,y=199+(i%2)*25;rect(x,y,92,60,'#785c64');poly([[x-9,y],[x+44,y-41],[x+101,y]],'#eedee2');rect(x+13,y+17,18,21,'#ffdc90');rect(x+60,y+17,16,21,'#ffdc90')}if(w===1){rect(0,319,800,5,'#675052');for(let i=0;i<3;i++){rect(220+i*100,264,96,44,'#384651');for(let j=0;j<4;j++)rect(228+i*100+j*22,272,15,15,'#ffd991');circle(238+i*100,312,9,'#433744');circle(298+i*100,312,9,'#433744')}}}
if(w!==4)for(let i=0;i<54;i++)circle((i*61+Math.sin(t+i)*7+800)%800,(i*71+t*12)%360,1+i%2,'#ffffffb0');}
setInterval(scene,matchMedia('(prefers-reduced-motion: reduce)').matches?60000:120);
function clear(){clearInterval(clock);playing=false;$('panel').replaceChildren();$('actions').replaceChildren();$('msg').textContent='';document.querySelectorAll('#scene button').forEach(b=>b.remove())}
function panel(title,body){let h=document.createElement('h2'),p=document.createElement('p');h.textContent=title;p.textContent=body;$('panel').append(h,p)}
function grid(){dayGrid.replaceChildren();for(let i=1;i<=24;i++){let b=document.createElement('button');b.textContent=i===1&&progress.done?'1 ✓':i;b.disabled=i!==1||(!$('test').checked&&dateKey<20261201);b.title=i===1?'Erstes Türchen':'Für die gemeinsame Ausarbeitung vorgesehen';if(i===1)b.className='active';b.onclick=start;dayGrid.append(b)}}
function home(){clear();let d=worlds[w];$('tag').textContent=d[2];$('title').textContent=d[1];$('intro').textContent=d[3];try{progress=JSON.parse(localStorage.getItem('advent26-v1-'+w))||{}}catch{progress={}}$('saved').textContent=progress.done?'1 von 24 geöffnet':'';scene();grid();if($('test').checked||dateKey>=20261201)act(progress.done?'Erstes Türchen erneut spielen':'Erstes Türchen öffnen',start)}
function start(){clear();let d=worlds[w];panel(d[4],d[5]);if(w===4)act('Suche starten · 60 Sekunden',hunt);else for(let i=0;i<2;i++)act(d[6+i],()=>{choice=i;clear();panel(d[4],d[8+i]);if(w===3)code();else act(['Zum Spielertunnel','Den ersten Halt ausrufen','Zum Dorfbrunnen'][w],()=>finish(d[10+i]))});$('panel').scrollIntoView({block:'center'})}
function finish(s){clear();progress={done:true,choice,ending:s};save();panel('Erste Seite im Winteralbum',s);grid();act('Zur Kalenderwelt',home)}
function code(){let keys=choice?['Mitte','Links','Rechts']:['Rechts','Mitte','Links'];sequence=[];$('msg').textContent='Funkfolge merken: '+keys.join(' → ');act('Funkfolge eingeben',()=>{$('actions').replaceChildren();$('msg').textContent='Tippe die drei Sektoren in der richtigen Reihenfolge.';for(let k of ['Links','Mitte','Rechts'])act(k,()=>{if(k!==keys[sequence.length]){sequence=[];$('msg').textContent='Funkstörung. Noch einmal: '+keys.join(' → ');return}sequence.push(k);$('msg').textContent=sequence.join(' → ');if(sequence.length===3)finish(worlds[w][10+choice])})})}
const objects=[['Schlüssel','🗝️',73,54],['Brief','✉️',27,82],['Taschenuhr','⌚',88,86],['Garn','🧶',9,74],['Kerze','🕯️',37,58],['Pinsel','🖌️',54,77],['Feder','🪶',60,28],['Brille','👓',35,28],['Tasse','☕',66,88]];
function hunt(){clear();playing=true;found=[];hints=0;deadline=Date.now()+60000;panel('Das verlassene Atelier','Finde Schlüssel, Brief und Taschenuhr im Bild.');function tick(){let left=Math.ceil((deadline-Date.now())/1000);if(left<=0){clear();panel('Die Atelieruhr schlägt','Du kannst die Suche noch einmal beginnen.');act('Erneut suchen',hunt);return false}$('msg').textContent=left+' s · '+found.length+'/3 gefunden · '+hints+' Hinweise';return true}objects.forEach(([name,icon,x,y],i)=>{let b=document.createElement('button');b.textContent=icon;b.setAttribute('aria-label',name);b.style.left=x+'%';b.style.top=y+'%';b.dataset.obj=i;$('scene').append(b);b.onclick=()=>{if(!playing||!tick()||i>2||found.includes(i))return;found.push(i);b.hidden=true;if(found.length===3){let points=Math.max(0,300+Math.ceil((deadline-Date.now())/1000)*5-hints*50);finish('Unter dem Brief liegt eine Eintrittskarte für zwei. Deine erste Albumseite ist komplett. '+points+' Punkte.')}else tick()}});act('Hinweis · −50 Punkte',()=>{if(!tick())return;let b=[...document.querySelectorAll('#scene button')].slice(0,3).find(b=>!b.hidden);if(!b.classList.contains('hint')){b.classList.add('hint');hints++}tick()});clock=setInterval(tick,250);tick();$('scene').scrollIntoView({block:'center'})}
worlds.forEach((d,i)=>{if(d&&(fixed===null||i===fixed))world.add(new Option(d[0],i))});world.onchange=()=>{w=Number(world.value);home()};$('test').onchange=home;
$('music').onclick=async()=>{if(audio){clearInterval(musicTimer);await audio.close();audio=null;$('music').textContent='♫ Musik einschalten';return}audio=new (window.AudioContext||window.webkitAudioContext)();await audio.resume();let n=0;function note(){let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.frequency.value=[392,494,587,494,440,523,659,523][n++%8];g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.045,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+.7);o.connect(g);g.connect(audio.destination);o.start();o.stop(t+.72)}note();musicTimer=setInterval(note,750);$('music').textContent='♫ Musik ausschalten'};home();
</script></html>
